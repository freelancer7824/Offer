<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Facebook</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #f0f2f5;
            color: #050505;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
        }

        .fb-container {
            width: 100%;
            max-width: 500px;
            background-color: #ffffff;
            min-height: 100vh;
            position: relative;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .click-effect {
            position: relative;
            overflow: hidden;
            transition: opacity 0.15s ease, transform 0.1s ease;
            cursor: pointer;
        }

        .click-effect:active {
            opacity: 0.7;
            transform: scale(0.97);
        }

        .fb-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: #ffffff;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .fb-logo {
            color: #1877f2;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -1px;
            cursor: pointer;
            text-decoration: none;
        }

        .header-icons {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            background-color: #e4e6eb;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #050505;
            cursor: pointer;
            border: none;
            text-decoration: none;
        }

        .fb-nav-tabs {
            display: flex;
            justify-content: space-around;
            border-bottom: 1px solid #ced0d4;
            background: #ffffff;
            position: sticky;
            top: 56px;
            z-index: 99;
        }

        .nav-tab {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 48px;
            font-size: 20px;
            color: #65676b;
            position: relative;
            cursor: pointer;
            border: none;
            background: none;
            text-decoration: none;
        }

        .nav-tab.active {
            color: #1877f2;
            border-bottom: 3px solid #1877f2;
        }

        .nav-tab .badge {
            position: absolute;
            top: 6px;
            right: 22%;
            background-color: #e41e3f;
            color: white;
            font-size: 10px;
            padding: 1px 4px;
            border-radius: 10px;
            font-weight: bold;
        }

        .view-section {
            display: none;
        }

        .view-section.active-view {
            display: block;
        }

        .create-post-section {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            background: #ffffff;
            border-bottom: 8px solid #f0f2f5;
            gap: 10px;
        }

        .profile-pic {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            cursor: pointer;
        }

        .post-input-box {
            flex: 1;
            border: 1px solid #ccd0d5;
            border-radius: 20px;
            padding: 9px 15px;
            color: #65676b;
            font-size: 15px;
            background: #ffffff;
            text-align: left;
            cursor: pointer;
            user-select: none;
            text-decoration: none;
            display: block;
        }

        .photo-icon-btn {
            color: #45bd62;
            font-size: 22px;
            cursor: pointer;
            background: none;
            border: none;
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .stories-container {
            display: flex;
            gap: 8px;
            padding: 12px;
            background: #f0f2f5;
            overflow-x: auto;
            border-bottom: 8px solid #f0f2f5;
            scrollbar-width: none;
        }

        .stories-container::-webkit-scrollbar {
            display: none;
        }

        .story-card {
            min-width: 110px;
            height: 190px;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            background: #ffffff;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            cursor: pointer;
            flex-shrink: 0;
            text-decoration: none;
            display: block;
        }

        .story-card.create-story {
            border: 1px solid #e4e6eb;
            display: flex;
            flex-direction: column;
        }

        .create-story-top {
            height: 70%;
            position: relative;
            background: #fff;
        }

        .create-story-top img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .add-story-icon-wrap {
            position: absolute;
            bottom: -16px;
            left: 50%;
            transform: translateX(-50%);
            width: 32px;
            height: 32px;
            background: #1877f2;
            border: 3px solid #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
        }

        .create-story-bottom {
            height: 30%;
            background: #ffffff;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 10px;
            font-size: 12px;
            font-weight: 600;
            color: #050505;
            text-align: center;
        }

        .story-card img.story-bg {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .story-card .story-badge-num {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #1877f2;
            color: white;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            z-index: 2;
        }

        .story-card .story-name {
            position: absolute;
            bottom: 8px;
            left: 8px;
            right: 8px;
            color: white;
            font-size: 12px;
            font-weight: 600;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
            line-height: 1.2;
            z-index: 2;
        }

        .post-container {
            background: #ffffff;
            margin-bottom: 10px;
            border-bottom: 8px solid #f0f2f5;
            cursor: default;
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
        }

        .post-user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .post-avatar-wrap {
            position: relative;
        }

        .online-dot {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 10px;
            height: 10px;
            background-color: #31a24c;
            border: 2px solid #ffffff;
            border-radius: 50%;
        }

        .post-author-details h4 {
            font-size: 15px;
            font-weight: 600;
            color: #050505;
            cursor: pointer;
        }
        .post-author-details h4:hover {
            text-decoration: underline;
        }

        .post-time-privacy {
            font-size: 12px;
            color: #65676b;
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 1px;
        }

        .post-actions-right {
            display: flex;
            gap: 12px;
            color: #65676b;
            font-size: 18px;
            cursor: pointer;
        }

        .post-caption {
            padding: 0 12px 10px 12px;
            font-size: 15px;
            color: #050505;
            line-height: 1.4;
        }

        .post-media-content {
            width: 100%;
            border-top: 1px solid #f0f2f5;
            border-bottom: 1px solid #f0f2f5;
            background: #000000;
            text-align: center;
            display: block;
            text-decoration: none;
            position: relative;
            cursor: pointer;
        }

        .post-media-content img, 
        .post-media-content video {
            width: 100%;
            height: auto;
            max-height: 450px;
            object-fit: cover;
            display: block;
        }

        .post-stats {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            font-size: 13px;
            color: #65676b;
            border-bottom: 1px solid #f0f2f5;
            user-select: none;
            cursor: default;
        }

        .post-stats-left {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .post-stat-icons {
            display: inline-flex;
            gap: 2px;
        }

        .post-action-buttons {
            display: flex;
            justify-content: space-around;
            padding: 4px 0;
            border-bottom: 1px solid #f0f2f5;
            position: relative;
        }

        .action-btn {
            flex: 1;
            background: none;
            border: none;
            padding: 8px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            color: #65676b;
            cursor: pointer;
            text-decoration: none;
            user-select: none;
            transition: background 0.2s;
            position: relative;
            border-radius: 4px;
        }

        .action-btn:active {
            background-color: #f0f2f5;
        }

        .action-btn.liked {
            color: #1877f2;
        }

        .reaction-popup {
            position: absolute;
            bottom: 45px;
            left: 10px;
            background: #ffffff;
            border-radius: 35px;
            padding: 6px 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
            display: flex;
            gap: 8px;
            z-index: 500;
            opacity: 0;
            transform: scale(0.5) translateY(10px);
            pointer-events: none;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .reaction-popup.show {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
        }

        .reaction-icon {
            font-size: 28px;
            cursor: pointer;
            transition: transform 0.2s ease;
            display: inline-block;
        }

        .reaction-icon:hover {
            transform: scale(1.4) translateY(-8px);
        }

        .menu-view {
            background-color: #f0f2f5;
            min-height: calc(100vh - 104px);
            padding: 10px 12px 30px 12px;
        }

        .menu-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0 12px 0;
        }

        .menu-title-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-back-btn {
            font-size: 20px;
            background: none;
            border: none;
            cursor: pointer;
            color: #050505;
        }

        .menu-title {
            font-size: 24px;
            font-weight: 700;
            color: #050505;
        }

        .menu-top-actions {
            display: flex;
            gap: 8px;
        }

        .menu-card {
            background: #ffffff;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }

        .profile-card-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-profile-pic {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }

        .menu-profile-info h4 {
            font-size: 15px;
            font-weight: 600;
            color: #050505;
        }

        .menu-profile-info p {
            font-size: 13px;
            color: #65676b;
        }

        .profile-card-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .mini-avatar-stack {
            position: relative;
            width: 32px;
            height: 32px;
        }

        .mini-avatar-stack img {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            position: absolute;
            border: 2px solid #fff;
            object-fit: cover;
        }

        .mini-avatar-stack img:nth-child(1) {
            top: 0;
            left: 0;
            z-index: 2;
        }
        .mini-avatar-stack img:nth-child(2) {
            bottom: 0;
            right: 0;
            z-index: 1;
        }

        .dropdown-circle-btn {
            width: 30px;
            height: 30px;
            background-color: #e4e6eb;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #050505;
        }

        .invite-friends-card {
            background: #ffffff;
            border-radius: 8px;
            padding: 14px 12px;
            margin-bottom: 12px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            color: #050505;
            text-decoration: none;
        }

        .invite-heart-icon {
            color: #ff3040;
            font-size: 18px;
        }

        .shortcuts-heading {
            font-size: 15px;
            font-weight: 600;
            color: #65676b;
            margin-bottom: 8px;
        }

        .shortcuts-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .shortcut-item {
            background: #ffffff;
            border-radius: 8px;
            padding: 14px 12px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 10px;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }

        .shortcut-icon {
            font-size: 24px;
        }

        .shortcut-name {
            font-size: 15px;
            font-weight: 600;
            color: #050505;
        }

        .feed-loader {
            text-align: center;
            padding: 30px;
            color: #65676b;
        }
        .feed-loader i {
            font-size: 28px;
            animation: spinRefresh 1s infinite linear;
        }

        @keyframes spinRefresh {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .infinite-scroll-trigger {
            height: 20px;
            text-align: center;
            padding: 20px 0;
            color: #65676b;
            font-size: 14px;
        }

        .infinite-scroll-trigger .loader-spinner {
            display: inline-block;
            animation: spinRefresh 1s infinite linear;
            margin-right: 8px;
        }

        .swipe-refresh-indicator {
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(-50px);
            width: 40px;
            height: 40px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            transition: transform 0.1s ease, opacity 0.1s ease;
        }

        .swipe-refresh-indicator i {
            color: #1877f2;
            font-size: 18px;
            transition: transform 0.2s ease;
        }

        .swipe-refresh-indicator.spinning i {
            animation: spinRefresh 0.8s infinite linear;
        }

        .toast-notification {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 9999;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
            max-width: 90%;
        }

        .toast-notification.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .story-viewer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000;
            z-index: 99999;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .story-viewer-overlay.active {
            display: flex;
        }

        .story-viewer-content {
            width: 100%;
            max-width: 500px;
            height: 100vh;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        .story-viewer-content img,
        .story-viewer-content video {
            max-width: 100%;
            max-height: 100vh;
            object-fit: contain;
        }

        .story-close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 28px;
            cursor: pointer;
            z-index: 10;
            background: rgba(0,0,0,0.5);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
        }

        .story-progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: rgba(255,255,255,0.3);
            z-index: 5;
        }

        .story-progress-fill {
            height: 100%;
            background: #1877f2;
            width: 0%;
            transition: width 0.1s linear;
        }

        .story-user-info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .story-user-info img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid #1877f2;
        }

        .story-user-info span {
            font-size: 14px;
            font-weight: 600;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        .story-nav-area {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 50%;
            z-index: 3;
            cursor: pointer;
        }

        .story-nav-area.prev {
            left: 0;
        }

        .story-nav-area.next {
            right: 0;
        }

        .no-posts-message {
            text-align: center;
            padding: 40px 20px;
            color: #65676b;
            font-size: 16px;
        }

        .no-posts-message i {
            font-size: 48px;
            color: #ced0d4;
            margin-bottom: 15px;
            display: block;
        }
    </style>
</head>
<body>

    <div class="fb-container" id="fbContainer">
        <div class="swipe-refresh-indicator" id="refreshIndicator">
            <i class="fa-solid fa-arrows-rotate"></i>
        </div>

        <div class="toast-notification" id="toastNotification"></div>

        <!-- Story Viewer -->
        <div class="story-viewer-overlay" id="storyViewer">
            <div class="story-viewer-content" id="storyViewerContent">
                <div class="story-progress-bar">
                    <div class="story-progress-fill" id="storyProgress"></div>
                </div>
                <div class="story-user-info" id="storyUserInfo">
                    <img src="" alt="User" id="storyUserAvatar">
                    <span id="storyUserName">User</span>
                </div>
                <button class="story-close-btn" onclick="closeStoryViewer()">
                    <i class="fa-solid fa-xmark"></i>
                </button>
                <div class="story-nav-area prev" onclick="prevStory()"></div>
                <div class="story-nav-area next" onclick="nextStory()"></div>
                <div id="storyMediaContainer"></div>
            </div>
        </div>

        <div class="fb-header">
            <a href="#" class="fb-logo click-effect" onclick="goHome()">facebook</a>
            <div class="header-icons">
                <a href="#" class="icon-btn click-effect" onclick="navigateTo('create-post')"><i class="fa-solid fa-plus"></i></a>
                <a href="#" class="icon-btn click-effect" onclick="navigateTo('search')"><i class="fa-solid fa-magnifying-glass"></i></a>
                <button class="icon-btn click-effect" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></button>
            </div>
        </div>

        <div class="fb-nav-tabs">
            <button class="nav-tab active click-effect" onclick="switchView('home')">
                <i class="fa-solid fa-house"></i>
                <span class="badge" id="notificationBadge">0</span>
            </button>
            <a href="#" class="nav-tab click-effect" onclick="navigateTo('friends')">
                <i class="fa-solid fa-user-group"></i>
            </a>
            <a href="#" class="nav-tab click-effect" onclick="navigateTo('messenger')">
                <i class="fa-brands fa-facebook-messenger"></i>
            </a>
            <a href="#" class="nav-tab click-effect" onclick="navigateTo('watch')">
                <i class="fa-solid fa-tv"></i>
            </a>
            <a href="#" class="nav-tab click-effect" onclick="navigateTo('notifications')">
                <i class="fa-solid fa-bell"></i>
            </a>
            <button class="nav-tab click-effect" onclick="toggleMenu()">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>

        <!-- HOME VIEW -->
        <div id="homeView" class="view-section active-view">
            <div class="create-post-section">
                <a href="#" class="click-effect" onclick="navigateTo('profile')">
                    <img src="" alt="Profile" class="profile-pic" id="currentUserAvatar">
                </a>
                <a href="#" class="post-input-box click-effect" onclick="navigateTo('create-post')">What's on your mind?</a>
                <a href="#" class="photo-icon-btn click-effect" onclick="navigateTo('create-post')"><i class="fa-solid fa-images"></i></a>
            </div>

            <div class="stories-container" id="storiesContainer">
                <!-- Stories will be loaded from Firebase -->
            </div>

            <div id="feedPostsContainer">
                <div class="feed-loader"><i class="fa-solid fa-spinner"></i> Loading feed...</div>
            </div>
            <div class="infinite-scroll-trigger" id="scrollTrigger">
                <span class="loader-spinner" style="display:none;"><i class="fa-solid fa-spinner"></i></span>
                <span id="loadMoreText">Load more posts</span>
            </div>
        </div>

        <!-- MENU VIEW -->
        <div id="menuView" class="view-section menu-view">
            <div class="menu-top-bar">
                <div class="menu-title-area">
                    <button class="menu-back-btn click-effect" onclick="toggleMenu()"><i class="fa-solid fa-chevron-left"></i></button>
                    <h1 class="menu-title">Menu</h1>
                </div>
                <div class="menu-top-actions">
                    <button class="icon-btn click-effect" onclick="logoutUser()"><i class="fa-solid fa-sign-out-alt" style="font-size: 14px;"></i></button>

                    const data = snapshot.val();
                    currentUser.name = data.name || data.firstName + ' ' + data.lastName || user.displayName || 'User';
                    currentUser.avatar = data.avatar || data.profilePic || user.photoURL || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(currentUser.name) + '&background=1877f2&color=fff&size=100';

                    loadFeed();

        // ============================================================

        function loadFeed() {
            if (isFeedLoading) return;
            isFeedLoading = true;
            
            const feedContainer = document.getElementById('feedPostsContainer');
            feedContainer.innerHTML = '<div class="feed-loader"><i class="fa-solid fa-spinner"></i> Loading feed...</div>';
            
            database.ref('feedItems').orderByChild('timestamp').once('value')
                .then((snapshot) => {
                    if (snapshot.exists()) {
                        const items = [];
                        snapshot.forEach((child) => {
                            const data = child.val();
                            data._id = child.key;
                            items.push(data);
                        });
                        items.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                        feedItems = items;
                        displayedCount = 0;
                        allLoaded = false;
                        feedContainer.innerHTML = '';
                        loadMorePosts();
                    } else {
                        feedContainer.innerHTML = `
                            <div class="no-posts-message">
                                <i class="fa-regular fa-newspaper"></i>
                                <p>No posts yet. Create your first post!</p>
                            </div>
                        `;
                    }
                    isFeedLoading = false;
                })
                .catch((error) => {
                    console.error("Firebase fetch error:", error);
                    showToast('Failed to load posts', 'error');
                    feedContainer.innerHTML = `
                        <div class="no-posts-message">
                            <i class="fa-solid fa-triangle-exclamation"></i>
                            <p>Failed to load posts. Please try again.</p>
                        </div>

                    isFeedLoading = false;
                });
        }

                                onmouseup="event.stopPropagation();cancelLongPress('${postId}')"

        function loadMorePosts() {
            if (isLoadingMore) return;
            if (allLoaded) {
                updateLoadMoreState();
                return;
            }
            
            isLoadingMore = true;
            
            const trigger = document.getElementById('scrollTrigger');
            const loadMoreText = document.getElementById('loadMoreText');
            const loaderSpinner = trigger.querySelector('.loader-spinner');
            
            if (loadMoreText) loadMoreText.textContent = 'Loading...';
            if (loaderSpinner) loaderSpinner.style.display = 'inline-block';

            const feedContainer = document.getElementById('feedPostsContainer');
            
            if (displayedCount >= feedItems.length) {
                allLoaded = true;
                isLoadingMore = false;
                updateLoadMoreState();
                return;
            }

            const endIndex = Math.min(displayedCount + batchSize, feedItems.length);
            const batch = feedItems.slice(displayedCount, endIndex);
            displayedCount = endIndex;

            renderPostBatch(batch, feedContainer);
            updateLoadMoreState();

            if (displayedCount >= feedItems.length) {
                allLoaded = true;
                updateLoadMoreState();
            }

            isLoadingMore = false;
            const spinner = document.getElementById('scrollTrigger').querySelector('.loader-spinner');
            if (spinner) spinner.style.display = 'none';
        }

        function updateLoadMoreState() {
            const trigger = document.getElementById('scrollTrigger');
            const loadMoreText = document.getElementById('loadMoreText');
            const loaderSpinner = trigger.querySelector('.loader-spinner');
            
            if (allLoaded || displayedCount >= feedItems.length) {
                allLoaded = true;
                if (loadMoreText) loadMoreText.textContent = 'No more posts to load';
                if (loaderSpinner) loaderSpinner.style.display = 'none';
            } else {
                if (loadMoreText) loadMoreText.textContent = 'Load more posts';
                if (loaderSpinner) loaderSpinner.style.display = 'none';
            }
        }

        function hidePost(postId) {
            database.ref(`feedItems/${postId}`).remove().then(() => {
                showToast('Post hidden');
                const postElement = document.querySelector(`.post-container[data-id="${postId}"]`);
                if (postElement) postElement.remove();
                feedItems = feedItems.filter(item => item._id !== postId);
            }).catch(() => {
                showToast('Failed to hide post', 'error');
            });
        }

        // ============================================================
        // FACEBOOK LIKE REACTION - FIXED with better error handling
        // ============================================================
        function handleReaction(postId, emoji) {
            if (!postId) {
                showToast('Error: Post not found', 'error');
                return;
            }

            const postRef = database.ref(`feedItems/${postId}`);
            const userEmail = currentUser.email || 'anonymous';
            
            postRef.once('value')
                .then((snapshot) => {
                    if (!snapshot.exists()) {
                        showToast('Post not found', 'error');
                        return;
                    }
                    
                    const postData = snapshot.val();
                    if (!postData) return;
                    
                    const likedBy = postData.likedBy || {};
                    let newLikesCount = postData.likesCount || 0;
                    let newEmoji = postData.likesEmoji || '👍';
                    
                    if (likedBy[userEmail]) {
                        delete likedBy[userEmail];
                        newLikesCount = Math.max(0, newLikesCount - 1);
                        
                        const emojiCounts = {};
                        Object.values(likedBy).forEach(e => {
                            emojiCounts[e] = (emojiCounts[e] || 0) + 1;
                        });
                        let maxCount = 0;
                        for (const [e, count] of Object.entries(emojiCounts)) {
                            if (count > maxCount) {
                                maxCount = count;
                                newEmoji = e;
                            }
                        }
                        if (Object.keys(emojiCounts).length === 0) newEmoji = '👍';
                    } else {
                        likedBy[userEmail] = emoji || '👍';
                        newLikesCount += 1;
                        
                        const emojiCounts = {};
                        Object.values(likedBy).forEach(e => {
                            emojiCounts[e] = (emojiCounts[e] || 0) + 1;
                        });
                        let maxCount = 0;
                        for (const [e, count] of Object.entries(emojiCounts)) {
                            if (count > maxCount) {
                                maxCount = count;
                                newEmoji = e;
                            }
                        }
                    }
                    
                    // Update UI immediately (optimistic)
                    updatePostUI(postId, newLikesCount, newEmoji, likedBy[userEmail] || null);
                    
                    // Close popup
                    const popup = document.getElementById(`reactionPopup-${postId}`);
                    if (popup) popup.classList.remove('show');
                    
                    // Save to Firebase
                    postRef.update({
                        likesCount: newLikesCount,
                        likesEmoji: newEmoji,
                        likedBy: likedBy
                    }).catch((err) => {
                        console.error('Firebase update error:', err);
                        showToast('Failed to save like', 'error');
                    });
                })
                .catch((error) => {
                    console.error('Reaction error:', error);
                    showToast('Failed to update like', 'error');
                });
        }

        function updatePostUI(postId, newLikesCount, newEmoji, userReaction) {
            const statCount = document.getElementById(`statCount-${postId}`);
            const statIcons = document.getElementById(`statIcons-${postId}`);
            if (statCount) statCount.textContent = newLikesCount;
            if (statIcons) statIcons.innerHTML = `<span>${newEmoji}</span>`;
            
            const btnIcon = document.getElementById(`btnIcon-${postId}`);
            const btnText = document.getElementById(`btnText-${postId}`);
            const likeBtn = document.getElementById(`likeBtn-${postId}`);
            
            if (btnText && btnIcon && likeBtn) {
                if (userReaction) {
                    btnIcon.innerHTML = userReaction;
                    btnText.textContent = 'Liked';
                    likeBtn.classList.add('liked');
                } else {
                    btnIcon.innerHTML = '<i class="fa-regular fa-thumbs-up"></i>';
                    btnText.textContent = 'Like';
                    likeBtn.classList.remove('liked');
                }
            }
        }

        // LOAD STORIES FROM FIREBASE - FIXED: No recursion
        // ============================================================
        function loadStories() {
            if (isStoriesLoading) return;
            isStoriesLoading = true;
            
            const container = document.getElementById('storiesContainer');
            
            database.ref('stories').orderByChild('timestamp').once('value')
                .then((snapshot) => {
                    if (snapshot.exists()) {
                        const stories = [];
                        snapshot.forEach((child) => {
                            const data = child.val();
                            data._id = child.key;
                            stories.push(data);
                        });
                        stories.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                        storiesData = stories;
                        renderStories(stories);
                    } else {
                        renderStories([]);
                    }
                    isStoriesLoading = false;
                })
                .catch((error) => {
                    console.error('Error loading stories:', error);
                    renderStories([]);
                    isStoriesLoading = false;
                });
        }

            stories.forEach((story, index) => {
                const avatarUrl = story.avatar || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(story.name || 'User') + '&background=1877f2&color=fff&size=100';
                html += `
                    <a href="#" class="story-card click-effect" onclick="openStoryViewer(${index})">
                        <img src="${story.media || 'https://via.placeholder.com/300x400/1877f2/ffffff?text=Story'}" alt="${story.name || 'User'}" class="story-bg">
                        <div class="story-name">${story.name || 'User'}</div>
                    </a>
                `;
            });

            container.innerHTML = html;
        }

        // ============================================================
        // STORY VIEWER
        // ============================================================
        function openStoryViewer(index) {
            storyIndex = index;
            const viewer = document.getElementById('storyViewer');
            viewer.classList.add('active');
            showStory(index);
        }

        function showStory(index) {
            if (index < 0 || index >= storiesData.length) {
                closeStoryViewer();
                return;
            }

            const story = storiesData[index];
            const container = document.getElementById('storyMediaContainer');
            
            document.getElementById('storyUserAvatar').src = story.avatar || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(story.name || 'User') + '&background=1877f2&color=fff&size=100';
            document.getElementById('storyUserName').textContent = story.name || 'User';

            if (story.contentType === 'video') {
                container.innerHTML = `
                    <video controls autoplay playsinline style="max-width:100%;max-height:100vh;object-fit:contain;">
                        <source src="${story.media}" type="video/mp4">
                    </video>
                `;
            } else {
                container.innerHTML = `
                    <img src="${story.media}" alt="Story" style="max-width:100%;max-height:100vh;object-fit:contain;">
                `;
            }

            const progress = document.getElementById('storyProgress');
            progress.style.width = '0%';
            
            clearTimeout(storyTimer);
            let progressValue = 0;
            storyTimer = setInterval(() => {
                progressValue += 2;
                progress.style.width = progressValue + '%';
                if (progressValue >= 100) {
                    clearInterval(storyTimer);
                    setTimeout(() => {
                        nextStory();
                    }, 300);
                }
            }, 100);
        }

        function nextStory() {
            if (storyIndex < storiesData.length - 1) {
                storyIndex++;
                showStory(storyIndex);
            } else {
                closeStoryViewer();
            }
        }

        function prevStory() {
            if (storyIndex > 0) {
                storyIndex--;
                showStory(storyIndex);
            }
        }

        function closeStoryViewer() {
            const viewer = document.getElementById('storyViewer');
            viewer.classList.remove('active');
            clearTimeout(storyTimer);
            document.getElementById('storyMediaContainer').innerHTML = '';
        }

        document.addEventListener('keydown', (e) => {
            if (document.getElementById('storyViewer').classList.contains('active')) {
                if (e.key === 'ArrowRight') nextStory();
                if (e.key === 'ArrowLeft') prevStory();
                if (e.key === 'Escape') closeStoryViewer();
            }
        });

        // ============================================================
        // INFINITE SCROLL
        // ============================================================
        let infiniteObserver = null;

        function setupInfiniteScroll() {
            const trigger = document.getElementById('scrollTrigger');
            if (!trigger) return;

            if (infiniteObserver) {
                infiniteObserver.disconnect();
            }

            infiniteObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting && !isLoadingMore && !allLoaded && feedItems.length > 0) {
                        loadMorePosts();
                    }
                });
            }, {
                root: null,
                rootMargin: '0px 0px 100px 0px',
                threshold: 0.1
            });

            infiniteObserver.observe(trigger);
        }

        // ============================================================
        // NAVIGATION FUNCTIONS
        // ============================================================
        function goHome() {
            const homeView = document.getElementById('homeView');
            const menuView = document.getElementById('menuView');
            const navTabs = document.querySelectorAll('.fb-nav-tabs .nav-tab');
            
            menuView.classList.remove('active-view');
            homeView.classList.add('active-view');
            navTabs.forEach((tab, index) => {
                if (index === 0) tab.classList.add('active');
                else tab.classList.remove('active');
            });
            
            const savedPos = parseInt(sessionStorage.getItem('homeScrollPosition') || '0');
            setTimeout(() => {
                window.scrollTo(0, savedPos);
            }, 50);
            
            history.pushState({ page: 'home', scrollY: window.scrollY }, '', '#home');
        }

        function switchView(viewName) {
            document.querySelectorAll('.feed-video').forEach(v => v.pause());
            const homeView = document.getElementById('homeView');
            const menuView = document.getElementById('menuView');
            const navTabs = document.querySelectorAll('.fb-nav-tabs .nav-tab');

            if (viewName === 'menu') {
                sessionStorage.setItem('homeScrollPosition', window.scrollY);
                homeView.classList.remove('active-view');
                menuView.classList.add('active-view');
                navTabs.forEach((tab, index) => {
                    if (index === navTabs.length - 1) tab.classList.add('active');
                    else tab.classList.remove('active');
                });
                window.scrollTo(0, 0);
                history.pushState({ page: 'menu' }, '', '#menu');
            } else {
                menuView.classList.remove('active-view');
                homeView.classList.add('active-view');
                navTabs.forEach((tab, index) => {
                    if (index === 0) tab.classList.add('active');
                    else tab.classList.remove('active');
                });
                const saved = parseInt(sessionStorage.getItem('homeScrollPosition') || '0');
                setTimeout(() => window.scrollTo(0, saved), 50);
                history.pushState({ page: 'home', scrollY: window.scrollY }, '', '#home');
            }
        }

        function toggleMenu() {
            const menuView = document.getElementById('menuView');
            if (menuView.classList.contains('active-view')) {
                switchView('home');
            } else {
                switchView('menu');
            }
        }

        function navigateTo(page, event) {
            if (event) event.preventDefault();
            
            sessionStorage.setItem('homeScrollPosition', window.scrollY);
            sessionStorage.setItem('lastPage', 'home');
            sessionStorage.setItem('navigateTo', page);
            
            if (page !== 'home') {
                showToast(`📱 ${page} page (Coming soon)`);
                history.pushState({ page: page, scrollY: window.scrollY }, '', `#${page}`);
            } else {
                goHome();
            }
        }

        // ============================================================
        // USER PROFILE
        // ============================================================
        function openUserProfile(userId) {
            sessionStorage.setItem('homeScrollPosition', window.scrollY);
            sessionStorage.setItem('userId', userId);
            sessionStorage.setItem('lastPage', 'home');
            window.location.href = 'profile.html';
        }

        // ============================================================
        // POST DETAIL
        // ============================================================
        function openPostDetail(postId) {
            sessionStorage.setItem('homeScrollPosition', window.scrollY);
            sessionStorage.setItem('postToOpen', postId);
            sessionStorage.setItem('lastPage', 'home');
            window.location.href = 'open.html';
        }

        // ============================================================
        // SHARE POST
        // ============================================================
        function sharePost(postId) {
            sessionStorage.setItem('homeScrollPosition', window.scrollY);
            sessionStorage.setItem('postToShare', postId);
            sessionStorage.setItem('lastPage', 'home');
            window.location.href = 'share.html';
        }

        // ============================================================
        // LONG PRESS FOR REACTION POPUP
        // ============================================================
        function startLongPress(postId) {
            if (pressTimer) clearTimeout(pressTimer);
            pressTimer = setTimeout(() => {
                const popup = document.getElementById(`reactionPopup-${postId}`);
                if (popup) {
                    document.querySelectorAll('.reaction-popup').forEach(p => {
                        if (p.id !== `reactionPopup-${postId}`) p.classList.remove('show');
                    });
                    popup.classList.add('show');
                }
            }, 500);
        }

        function cancelLongPress(postId) {
            clearTimeout(pressTimer);
            pressTimer = null;
        }

        // ============================================================
        // CLOSE POPUPS ON CLICK OUTSIDE
        // ============================================================
        document.addEventListener('click', function(e) {
            const isPopupClick = e.target.closest('.reaction-popup');
            const isActionBtn = e.target.closest('.action-btn');
            const isReactionIcon = e.target.closest('.reaction-icon');
            
            if (!isPopupClick && !isActionBtn && !isReactionIcon) {
                document.querySelectorAll('.reaction-popup').forEach(popup => {
                    popup.classList.remove('show');
                });
            }
        });

        // ============================================================
        // VIDEO OBSERVER
        // ============================================================
        function initIntersectionVideoObserver() {
            const allVideos = document.querySelectorAll('.feed-video');

            const observerOptions = {
                root: null,
                rootMargin: '0px',
                threshold: 0.5
            };

            const videoObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const video = entry.target;
                    if (entry.isIntersecting) {
                        video.play().catch(() => {});
                    } else {
                        if (!video.paused) video.pause();
                    }
                });
            }, observerOptions);

            allVideos.forEach(video => {
                videoObserver.observe(video);
                video.onplay = function() {
                    allVideos.forEach(other => {
                        if (other !== video && !other.paused) other.pause();
                    });
                };
            });
        }

        // ============================================================
        // SWIPE REFRESH
        // ============================================================
        let startY = 0;
        let pulling = false;
        const refreshIndicator = document.getElementById('refreshIndicator');

        window.addEventListener('touchstart', (e) => {
            if (window.scrollY === 0 && document.getElementById('homeView').classList.contains('active-view')) {
                startY = e.touches[0].clientY;
                pulling = true;
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (!pulling) return;
            const currentY = e.touches[0].clientY;
            const diff = currentY - startY;

            if (diff > 0 && diff < 150) {
                refreshIndicator.style.opacity = diff / 100;
                refreshIndicator.style.transform = `translateX(-50%) translateY(${diff * 0.5}px)`;
                refreshIndicator.querySelector('i').style.transform = `rotate(${diff * 2}deg)`;
            } else if (diff >= 150) {
                refreshIndicator.style.opacity = 1;
            }
        });

        window.addEventListener('touchend', (e) => {
            if (!pulling) return;
            pulling = false;
            const endY = e.changedTouches[0].clientY;
            const diff = endY - startY;

            if (diff > 100) {
                refreshIndicator.classList.add('spinning');
                refreshIndicator.style.transform = `translateX(-50%) translateY(50px)`;
                document.querySelectorAll('.feed-video').forEach(v => v.pause());
                
                setTimeout(() => {
                    loadFeed();
                    loadStories();
                    refreshIndicator.classList.remove('spinning');
                    refreshIndicator.style.opacity = 0;
                    refreshIndicator.style.transform = `translateX(-50%) translateY(-50px)`;
                    window.scrollTo(0, 0);
                    showToast('Feed refreshed! 🔄');
                }, 800);
            } else {
                refreshIndicator.style.opacity = 0;
                refreshIndicator.style.transform = `translateX(-50%) translateY(-50px)`;
            }
        });

        // ============================================================
        // BACK BUTTON HANDLER
        // ============================================================
        window.addEventListener('popstate', function(e) {
            const homeView = document.getElementById('homeView');
            const menuView = document.getElementById('menuView');
            
            const savedPos = parseInt(sessionStorage.getItem('homeScrollPosition') || '0');
            
            if (!menuView.classList.contains('active-view')) {
                homeView.classList.add('active-view');
                menuView.classList.remove('active-view');
                document.querySelectorAll('.fb-nav-tabs .nav-tab').forEach((tab, index) => {
                    if (index === 0) tab.classList.add('active');
                    else tab.classList.remove('active');
                });
                
                setTimeout(() => {
                    window.scrollTo(0, savedPos);
                }, 100);
            } else {
                goHome();
            }
            
            document.querySelectorAll('.reaction-popup').forEach(p => p.classList.remove('show'));
        });

        // Save scroll position
        let scrollTimeout;
        window.addEventListener('scroll', function() {
            clearTimeout(scrollTimeout);
            scrollTimeout = setTimeout(() => {
                if (document.getElementById('homeView').classList.contains('active-view')) {
                    sessionStorage.setItem('homeScrollPosition', window.scrollY);
                }
            }, 200);
        });

        // ============================================================
        // LIVE UPDATES - FIXED: No recursive calls
        // ============================================================
        database.ref('feedItems').on('child_changed', (snapshot) => {
            const data = snapshot.val();
            const postId = snapshot.key;
            const userEmail = currentUser.email || 'anonymous';
            const likedBy = data.likedBy || {};
            const userReaction = likedBy[userEmail] || null;
            updatePostUI(postId, data.likesCount || 0, data.likesEmoji || '👍', userReaction);
        });

        database.ref('feedItems').on('child_added', (snapshot) => {
            if (!isFeedLoading) {
                const newPost = snapshot.val();
                newPost._id = snapshot.key;
                
                const exists = feedItems.some(item => item._id === newPost._id);
                if (!exists) {
                    feedItems.unshift(newPost);
                    
                    if (displayedCount < feedItems.length && feedItems.length > 0) {
                        const feedContainer = document.getElementById('feedPostsContainer');
                        if (displayedCount < batchSize) {
                            const firstBatch = feedItems.slice(0, batchSize);
                            displayedCount = batchSize;
                            feedContainer.innerHTML = '';
                            renderPostBatch(firstBatch, feedContainer);
                        }
                    }
                }
            }
        });

        database.ref('stories').on('child_added', () => {
            if (!isStoriesLoading) {
                loadStories();
            }
        });

        // ============================================================
        // INIT
        // ============================================================
        window.addEventListener('DOMContentLoaded', function() {
            checkAuth();
            
            const lastPage = sessionStorage.getItem('lastPage');
            if (lastPage === 'home') {
                const pos = sessionStorage.getItem('homeScrollPosition');
                if (pos) {
                    setTimeout(function() {
                        window.scrollTo(0, parseInt(pos));
                    }, 300);
                }
                sessionStorage.removeItem('lastPage');
            } else {
                const savedPos = sessionStorage.getItem('homeScrollPosition');
                if (savedPos) {
                    setTimeout(function() {
                        window.scrollTo(0, parseInt(savedPos));
                    }, 300);
                }
            }
            
            setTimeout(setupInfiniteScroll, 500);
        });

        history.pushState({ page: 'home' }, '', '#home');
    </script>
</body>
</html>
